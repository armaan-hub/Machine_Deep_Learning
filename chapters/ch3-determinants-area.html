<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ch3 — Determinants</title><link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"></head><body>
<div class="chapter-shell"><header class="chapter-header"><a href="../index.html">← Home</a><span class="badge">Chapter 3</span><h1>Determinants & Area</h1></header><main class="chapter-main"><section class="canvas-area"><canvas id="c"></canvas></section><aside class="sidebar"><div class="panel"><div class="panel-title">Presets (1-5)</div><div id="presets" class="preset-bar"></div></div><div class="panel"><div class="transport-bar"><button id="play" class="btn">Play (Space)</button><button id="reset" class="btn">Reset (R)</button></div></div><div class="panel"><div class="panel-title">Info</div><div id="info" class="info-grid"></div></div><div class="panel"><div class="panel-title">Narration</div><div id="narr" class="narration"></div></div><div class="panel dl-panel"><div class="panel-title" id="dlh"></div><div id="dlc" class="narration"></div><pre class="code-block" id="dlcode"></pre></div><div class="panel exercise-panel"><div class="panel-title">Predict then reveal</div><div id="exercise"></div></div></aside></main><footer>Signed area and orientation</footer></div>
<script src="../js/math-core.js"></script><script src="../js/renderer.js"></script><script src="../js/animation.js"></script><script src="../js/dl-annotations.js"></script><script src="../js/ui-shared.js"></script>
<script>
(()=>{const c=document.getElementById('c'),r=new CanvasRenderer(c);const P=[{n:'Scale2x',M:[[2,0],[0,2]]},{n:'Reflect',M:[[-1,0],[0,1]]},{n:'Shear',M:[[1,1],[0,1]]},{n:'Near-singular',M:[[1,0],[0,0.08]]},{n:'Singular',M:[[1,0],[0,0]]}];const s={p:0,M:P[0].M,t:1};function setP(i){s.p=i;s.M=MathCore.clone(P[i].M);s.t=0;renderBtns();updEx();save();}
function renderBtns(){const el=document.getElementById('presets');el.innerHTML='';P.forEach((p,i)=>{const b=document.createElement('button');b.className='preset-btn'+(i===s.p?' active':'');b.textContent=`${i+1}. ${p.n}`;b.onclick=()=>setP(i);el.appendChild(b);});}
function play(){AnimationEngine.tween({duration:s.p===4?1500:1000,onUpdate:e=>s.t=e}).play();} function reset(){s.t=0;}
function orientArrow(det){const ctx=r.ctx,[x,y]=r.toScreen([0,0]);ctx.save();ctx.strokeStyle=det>0?'#43e8a8':det<0?'#e84393':'#aaa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x+40,y-36,18,0.2*Math.PI,1.6*Math.PI,det<0);ctx.stroke();ctx.restore();}
function draw(){const M=MathCore.interpolateMatrix(s.M,s.t,2),det=MathCore.det2(M);r.clear();r.drawGrid([[1,0],[0,1]],{ghost:true});r.drawGrid(M);const p0=[0,0],p1=MathCore.multiplyVec(M,[1,0]),p2=MathCore.multiplyVec(M,[1,1]),p3=MathCore.multiplyVec(M,[0,1]);const fill=Math.abs(det)<1e-3?'rgba(170,170,170,.3)':det>0?'rgba(67,232,168,.22)':'rgba(232,67,147,.22)';r.drawPolygon([p0,p1,p2,p3],fill,det>0?'#43e8a8':det<0?'#e84393':'#888');r.drawArrow([0,0],p1,'#e84393','î',3);r.drawArrow([0,0],p3,'#43e8a8','ĵ',3);orientArrow(det);const info=document.getElementById('info');info.innerHTML='';[['det',det.toFixed(4)],['|det|',Math.abs(det).toFixed(4)],['orientation',Math.abs(det)<1e-5?'collapse':det>0?'CCW positive':'CW flipped']].forEach(([k,v])=>{const d=document.createElement('div');d.className='info-item';d.innerHTML=`<span>${k}</span><span>${v}</span>`;info.appendChild(d)});document.getElementById('narr').textContent=Math.abs(det)<1e-5?'Area collapses to a line segment.':'Determinant is signed area scaling of the unit square.';}
function updEx(){const d=MathCore.det2(s.M);const idx=Math.abs(d)<1e-8?4:(d<0?3:(Math.abs(Math.abs(d)-1)<1e-4?2:(d>1?0:1)));UIShared.createPredictReveal(document.getElementById('exercise'),'Will area increase, decrease, stay the same, flip orientation, or collapse?',['Increase','Decrease','Stay the same','Flip orientation','Collapse'],idx,`det=${d.toFixed(3)}`);}
function save(){UIShared.saveHash('ch3',{p:s.p,t:s.t});}function load(){const h=UIShared.loadHash('ch3');if(!h)return; if(h.p>=0&&h.p<5){s.p=h.p;s.M=MathCore.clone(P[s.p].M);} s.t=h.t??1;}
document.getElementById('play').onclick=play;document.getElementById('reset').onclick=reset;UIShared.setupKeyboardShortcuts({Space:play,R:reset,1:()=>setP(0),2:()=>setP(1),3:()=>setP(2),4:()=>setP(3),5:()=>setP(4)});
const ann=DLAnnotations.get('jacobian_logdet');document.getElementById('dlh').textContent=ann.headline;document.getElementById('dlc').textContent=ann.dlConnection;document.getElementById('dlcode').textContent=ann.pytorch;load();renderBtns();updEx();AnimationEngine.add(draw);
})();
</script></body></html>
