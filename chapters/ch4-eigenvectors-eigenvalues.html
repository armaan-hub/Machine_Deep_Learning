<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ch4 — Eigenvectors</title><link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/layout.css"><link rel="stylesheet" href="../css/components.css"></head><body>
<div class="chapter-shell"><header class="chapter-header"><a href="../index.html">← Home</a><span class="badge">Chapter 4</span><h1>Eigenvectors & Eigenvalues</h1></header><main class="chapter-main"><section class="canvas-area"><canvas id="c"></canvas></section><aside class="sidebar"><div class="panel"><div class="panel-title">Presets (1-5)</div><div id="presets" class="preset-bar"></div></div><div class="panel"><div class="transport-bar"><button id="step" class="btn">Step</button><button id="run" class="btn">Run</button><button id="rand" class="btn">Random</button><button id="reset" class="btn">Reset (R)</button></div></div><div class="panel"><div class="panel-title">Info</div><div id="info" class="info-grid"></div></div><div class="panel"><div class="panel-title">Narration</div><div id="narr" class="narration"></div></div><div class="panel dl-panel"><div class="panel-title" id="dlh"></div><div id="dlc" class="narration"></div><pre class="code-block" id="dlcode"></pre></div><div class="panel exercise-panel"><div class="panel-title">Predict then reveal</div><div id="exercise"></div></div></aside></main><footer>Run = 3 steps/second, max 20</footer></div>
<script src="../js/math-core.js"></script><script src="../js/renderer.js"></script><script src="../js/animation.js"></script><script src="../js/dl-annotations.js"></script><script src="../js/ui-shared.js"></script>
<script>
(()=>{const c=document.getElementById('c'),r=new CanvasRenderer(c);const P=[[[2,0],[0,3]],[[2,0],[0,2]],[[0,-1],[1,0]],[[3,1],[0,2]],[[1.5,0],[0,0.5]]];const s={p:0,M:P[0],fan:Array.from({length:8},(_,i)=>[Math.cos(i*Math.PI/4),Math.sin(i*Math.PI/4)]),seed:[1,.3],prev:[1,.3],conv:0,n:0,timer:null};const labels=['Diagonal','Repeated','Rotation','Shear+Scale','ρ>1'];
function nm(v){const m=Math.hypot(v[0],v[1])||1;return[v[0]/m,v[1]/m]} function setP(i){s.p=i;s.M=MathCore.clone(P[i]);s.n=0;updDL();updEx();save();btns();}
function step(){s.prev=[...s.seed];s.seed=nm(MathCore.multiplyVec(s.M,s.seed));s.conv=Math.hypot(s.seed[0]-s.prev[0],s.seed[1]-s.prev[1]);s.n++;if(s.n>=20||s.conv<1e-4){clearInterval(s.timer);s.timer=null;}save();}
function run(){if(s.timer){clearInterval(s.timer);s.timer=null;return;}s.timer=setInterval(step,333);} function rand(){s.seed=nm([Math.random()*2-1,Math.random()*2-1]);} function reset(){clearInterval(s.timer);s.timer=null;s.seed=[1,.3];s.prev=[1,.3];s.conv=0;s.n=0;}
function btns(){const el=document.getElementById('presets');el.innerHTML='';labels.forEach((n,i)=>{const b=document.createElement('button');b.className='preset-btn'+(i===s.p?' active':'');b.textContent=`${i+1}. ${n}`;b.onclick=()=>setP(i);el.appendChild(b);});}
function draw(){const eig=MathCore.eigen2(s.M);r.clear();r.drawGrid([[1,0],[0,1]],{ghost:true});r.drawGrid(s.M);s.fan.forEach(v=>{r.drawArrow([0,0],v,'rgba(170,170,180,.35)','',1);r.drawArrow([0,0],MathCore.multiplyVec(s.M,v),'rgba(167,139,250,.35)','',1)});if(!eig.complex&&eig.vectors){if(eig.vectors[0]){const v=eig.vectors[0];r.drawArrow([0,0],[v[0]*4,v[1]*4],'#f7c948','eig1',3);}if(eig.vectors[1]&&!eig.repeated){const w=eig.vectors[1];r.drawArrow([0,0],[w[0]*4,w[1]*4],'#7c4dff','eig2',3);}}else{const [sx,sy]=r.toScreen([0,0]);r.ctx.fillStyle='#f7c948';r.ctx.fillText('No real eigenvectors',sx+12,sy-8);}r.drawArrow([0,0],s.seed,'#43e8a8','seed',3);const rho=Math.max(...eig.values.map(v=>Math.abs(v)));const info=document.getElementById('info');info.innerHTML='';[['eigenvalues',eig.complex?eig.display[0]:eig.display.join(', ')],['eigen angles',eig.complex?'none':eig.vectors.map(v=>v?((Math.atan2(v[1],v[0])*180/Math.PI).toFixed(1)+'°'):'-').join(', ')],['spectral radius ρ',rho.toFixed(3)],['||v_n-v_{n-1}||',s.conv.toExponential(2)],['steps',String(s.n)]].forEach(([k,v])=>{const d=document.createElement('div');d.className='info-item';d.innerHTML=`<span>${k}</span><span>${v}</span>`;info.appendChild(d)});document.getElementById('narr').textContent=eig.complex?'Complex eigenvalues: pure rotation has no real invariant line.':'Power iteration tracks dominant eigenvector.';}
function updDL(){const ann=(s.p===0||s.p===1)?DLAnnotations.get('pca'):DLAnnotations.get('spectral_radius');document.getElementById('dlh').textContent=ann.headline;document.getElementById('dlc').textContent=ann.dlConnection;document.getElementById('dlcode').textContent=ann.pytorch;}
function updEx(){const eig=MathCore.eigen2(s.M);const arrows=[[1,0],[Math.SQRT1_2,Math.SQRT1_2],[0,1],[-Math.SQRT1_2,Math.SQRT1_2]];let idx=0;if(!eig.complex&&eig.vectors&&eig.vectors[0]){let best=9;arrows.forEach((a,i)=>{const c=Math.abs(a[0]*eig.vectors[0][1]-a[1]*eig.vectors[0][0]);if(c<best){best=c;idx=i;}});}UIShared.createPredictReveal(document.getElementById('exercise'),'Which one stays on its own line?',['0°','45°','90°','135°'],idx,eig.complex?'No real eigenvector here.':'This direction aligns with an eigenvector.');}
function save(){UIShared.saveHash('ch4',{p:s.p,seed:s.seed,n:s.n});}function load(){const h=UIShared.loadHash('ch4');if(!h)return; if(h.p>=0&&h.p<5){s.p=h.p;s.M=MathCore.clone(P[s.p]);}if(h.seed)s.seed=h.seed;s.n=h.n||0;}
document.getElementById('step').onclick=step;document.getElementById('run').onclick=run;document.getElementById('rand').onclick=rand;document.getElementById('reset').onclick=reset;UIShared.setupKeyboardShortcuts({Space:run,R:reset,1:()=>setP(0),2:()=>setP(1),3:()=>setP(2),4:()=>setP(3),5:()=>setP(4)});
load();btns();updDL();updEx();AnimationEngine.add(draw);
})();
</script></body></html>
